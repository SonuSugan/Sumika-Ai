<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 240px; padding: 14px; background: #0c1220; color: #e8f4ff; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { font-size: 12px; color: #9fb3c8; margin: 4px 0; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .ok { background: #4ade80; }
    .bad { background: #f87171; }
  </style>
</head>
<body>
  <h1>Sumika Browser Control</h1>
  <p id="status"><span class="dot bad"></span>Checking backend…</p>
  <p>Backend must be running locally (localhost:5175) for Sumika to drive this browser.</p>
  <script src="popup.js"></script>
</body>
</html>
